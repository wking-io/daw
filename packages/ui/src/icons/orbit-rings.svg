<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer ring shape for clipping (the donut area) -->
    <clipPath id="outerRingClip">
      <path d="M50,5 A45,45 0 1,1 49.99,5 Z M50,15 A35,35 0 1,0 50.01,15 Z" clip-rule="evenodd"/>
    </clipPath>

    <!-- Inverse clip (center hole + outside) -->
    <clipPath id="outsideRingClip">
      <path d="M0,0 H100 V100 H0 Z M50,5 A45,45 0 1,1 49.99,5 Z M50,15 A35,35 0 1,0 50.01,15 Z" clip-rule="evenodd"/>
    </clipPath>

    <!-- Mask for outside: middle ring visible, inner ring cuts hole -->
    <mask id="outsideMask">
      <g transform="translate(50,50)">
        <circle r="8" fill="white">
          <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
            <mpath href="#orbitPath"/>
          </animateMotion>
        </circle>
        <circle r="4" fill="black">
          <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
            <mpath href="#orbitPath"/>
          </animateMotion>
        </circle>
      </g>
    </mask>

    <!-- Animation path: center->right, CCW circle, right->center, center->left, CW circle, left->center -->
    <path id="orbitPath" d="
      M0,0
      L25,0
      A25,25 0 0,0 0,-25
      A25,25 0 0,0 -25,0
      A25,25 0 0,0 0,25
      A25,25 0 0,0 25,0
      L0,0
      L-25,0
      A25,25 0 0,1 0,-25
      A25,25 0 0,1 25,0
      A25,25 0 0,1 0,25
      A25,25 0 0,1 -25,0
      L0,0
    " fill="none"/>
  </defs>

  <!-- Outer stationary white ring -->
  <path d="M50,5 A45,45 0 1,1 49.99,5 Z M50,15 A35,35 0 1,0 50.01,15 Z"
        fill="currentColor" fill-rule="evenodd"/>

  <!-- Inside the outer ring: middle=transparent (cut out), inner=white (filled back) -->
  <g clip-path="url(#outerRingClip)">
    <g transform="translate(50,50)">
      <path fill="currentColor" fill-rule="evenodd" d="M0,0 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 M0,0 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0">
        <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
          <mpath href="#orbitPath"/>
        </animateMotion>
      </path>
    </g>
  </g>

  <!-- Outside the outer ring: middle=white, inner=transparent via mask -->
  <g clip-path="url(#outsideRingClip)">
    <rect x="0" y="0" width="100" height="100" fill="currentColor" mask="url(#outsideMask)"/>
  </g>
</svg>
