<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip to inside the outer circle -->
    <clipPath id="insideClip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>

    <!-- Clip to outside the outer circle -->
    <clipPath id="outsideClip">
      <path d="M0,0 H100 V100 H0 Z M50,10 A40,40 0 1,1 49.99,10 Z" clip-rule="evenodd"/>
    </clipPath>

    <!-- Mask for inside: cut out middle ring (r=4 to r=8), keep inner circle -->
    <mask id="insideMask">
      <rect width="100" height="100" fill="white"/>
      <g transform="translate(50,50)">
        <!-- Cut out the middle ring area -->
        <circle r="8" fill="black">
          <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
            <mpath href="#orbitPath"/>
          </animateMotion>
        </circle>
        <!-- Restore the inner circle -->
        <circle r="4" fill="white">
          <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
            <mpath href="#orbitPath"/>
          </animateMotion>
        </circle>
      </g>
    </mask>

    <!-- Mask for outside: middle ring visible, inner circle cut out -->
    <mask id="outsideMask">
      <g transform="translate(50,50)">
        <circle r="8" fill="white">
          <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
            <mpath href="#orbitPath"/>
          </animateMotion>
        </circle>
        <circle r="4" fill="black">
          <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.08;0.42;0.5;0.58;0.92;1" keyTimes="0;0.0625;0.4375;0.5;0.5625;0.9375;1" calcMode="linear">
            <mpath href="#orbitPath"/>
          </animateMotion>
        </circle>
      </g>
    </mask>

    <!-- Animation path: center->right edge, CCW circle, right->center, center->left edge, CW circle, left->center -->
    <path id="orbitPath" d="
      M0,0
      L40,0
      A40,40 0 0,0 0,-40
      A40,40 0 0,0 -40,0
      A40,40 0 0,0 0,40
      A40,40 0 0,0 40,0
      L0,0
      L-40,0
      A40,40 0 0,1 0,-40
      A40,40 0 0,1 40,0
      A40,40 0 0,1 0,40
      A40,40 0 0,1 -40,0
      L0,0
    " fill="none"/>
  </defs>

  <!-- Inside the outer circle: white circle with middle ring cut out, inner circle remains -->
  <g clip-path="url(#insideClip)">
    <circle cx="50" cy="50" r="40" fill="currentColor" mask="url(#insideMask)"/>
  </g>

  <!-- Outside the outer circle: middle ring white, inner circle transparent -->
  <g clip-path="url(#outsideClip)">
    <rect x="0" y="0" width="100" height="100" fill="currentColor" mask="url(#outsideMask)"/>
  </g>
</svg>
